version: 2

models:
  - name: stg_sales
    columns:
      - name: sale_id
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
  - name: stg_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
  - name: stg_products
    columns:
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Drink', 'Pastry']

