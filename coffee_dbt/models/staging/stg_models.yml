version: 2

models:
  - name: stg_sales
    description: "One row per product per order (one receipt line), cleaned from fact_sales."
    columns:
      - name: sale_id
        data_tests:
          - unique
          - not_null
      - name: store_id
        description: "The store where the sale happened. Links to stg_stores.store_id." 
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
  - name: stg_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
  - name: stg_products
    columns:
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Drink', 'Pastry']
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: card_number
        data_tests:
          - unique
  - name: stg_dates
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

